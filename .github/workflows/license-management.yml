name: License Management Workflow

on:
  workflow_dispatch:
    inputs:
      customer_name:
        description: 'Tên khách hàng'
        required: true
      max_devices:
        description: 'Số thiết bị tối đa'
        required: false
        default: '3'
      duration:
        description: 'Thời hạn (ngày)'
        required: false
        default: '365'

permissions:
  contents: write

jobs:
  generate-license:
    # Pin the runner so a future ubuntu-latest migration cannot change the
    # environment underneath this workflow without review.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      
      - name: Install Dependencies
        run: npm install
      
      - name: Generate License
        run: |
          node scripts/generate-licenses.js \
            --customer "${{ github.event.inputs.customer_name }}" \
            --max-devices "${{ github.event.inputs.max_devices }}" \
            --duration "${{ github.event.inputs.duration }}"
      
      - name: Commit and Push
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add database/licenses.json
          git commit -m "Add new license for ${{ github.event.inputs.customer_name }}"
          git push
